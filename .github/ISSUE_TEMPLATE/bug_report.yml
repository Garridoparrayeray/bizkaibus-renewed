name: Algo no funciona
description: La aplicación falla, se ve mal o se comporta de forma rara.
title: "[Error] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si es un horario o una llegada incorrectos, usa mejor la plantilla «Horario o llegada incorrectos».
        Si crees que es un problema de seguridad, no lo publiques aquí: mira la [política de seguridad](https://github.com/Garridoparrayeray/bizkaibus-renewed/blob/master/SECURITY.md).
  - type: dropdown
    id: app
    attributes:
      label: ¿En qué app?
      options:
        - Bizkaibus+
        - Metro+
        - Euskotren+
        - Tranvía Bilbao+
        - Tranvía Vitoria+
        - Renfe Cercanías+
        - Menú de Bide+
        - En todas
    validations:
      required: true
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ocurre?
      description: Cuéntalo con tus palabras.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que ocurra
      placeholder: |
        1. Abro la app...
        2. Busco la parada...
        3. Pulso...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      description: Por ejemplo, «iPhone 14, Safari» o «Windows, Chrome 130». Indica si la usas instalada como app.
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o grabación
      description: Arrastra aquí las imágenes. Antes de subirlas, comprueba que no se ve nada personal.
  - type: checkboxes
    id: privacidad
    attributes:
      label: Antes de enviar
      options:
        - label: No he incluido datos personales (ubicación exacta, nombre, correo...).
          required: true
