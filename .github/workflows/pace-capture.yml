name: Ritmo de los buses (k)

# Captura periódica del feed en directo de Bizkaibus y recalibrado diario de los datos del algoritmo.
# El algoritmo y su documentación viven en un repositorio aparte (todos los derechos reservados).
# Las horas están en UTC; GitHub puede retrasar unos minutos los trabajos programados.

on:
  schedule:
    # Cada hora, en el minuto 17 (GitHub retrasa o pierde trabajos programados a la hora en punto).
    - cron: '17 * * * *'
    # Recalibrado diario.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos de captura (para probar, 3)'
        default: '45'
      recalibrate:
        description: 'Recalibrar en vez de capturar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pace-data
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  NAP_API_KEY: ${{ secrets.NAP_API_KEY }}

jobs:
  capture:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.recalibrate != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # El algoritmo vive en un repositorio privado y se coloca en bideplus/engine (esa carpeta no se sube a este repo).
      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: bideplus/engine

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      - name: Reconstruir la base de datos de Bizkaibus
        env:
          GEOCODE_MAX_NEW: '0'
          GEOCODE_MAX_RETRIES: '0'
        run: php bideplus/scripts/build-database.php --network=bus

      - name: Capturar el feed en directo
        env:
          MINUTES: ${{ github.event.inputs.minutes || '45' }}
        run: php bideplus/engine/bizkaibus/tools/realtime-backtest.php capture "$RUNNER_TEMP/capturas" "$MINUTES" 45

      - name: Medir la precision de las llegadas con esta captura
        continue-on-error: true
        timeout-minutes: 10
        run: |
          {
            echo "### Precision de las llegadas (esta captura contra los pasos reales por parada)"
            echo '```'
            php bideplus/engine/bizkaibus/tools/eval-eta.php "$RUNNER_TEMP/capturas" || echo "Sin datos suficientes"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Descargar las muestras acumuladas
        run: |
          gh release download pace-data -p pace-samples.jsonl -D "$RUNNER_TEMP" || echo "Todavia no hay muestras acumuladas"
          gh release download pace-data -p segment-samples.jsonl -D "$RUNNER_TEMP" || gunzip -c bideplus/engine/bizkaibus/data/segment-samples-seed.jsonl.gz > "$RUNNER_TEMP/segment-samples.jsonl"

      - name: Anadir las muestras de esta captura
        run: |
          php bideplus/engine/bizkaibus/tools/realtime-backtest.php samples "$RUNNER_TEMP/capturas" "$RUNNER_TEMP/pace-samples.jsonl"
          php bideplus/engine/bizkaibus/tools/realtime-backtest.php segment-samples "$RUNNER_TEMP/capturas" "$RUNNER_TEMP/segment-samples.jsonl"

      - name: Medir la cobertura del feed por linea
        # Cuantos viajes del horario en ruta aparecen en el feed. Si falla, no impide guardar el resto.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          gh release download pace-data -p coverage-samples.jsonl -D "$RUNNER_TEMP" || echo "Todavia no hay cobertura acumulada"
          php bideplus/engine/bizkaibus/tools/coverage-samples.php "$RUNNER_TEMP/capturas" "$RUNNER_TEMP/coverage-samples.jsonl" 15

      - name: Guardar las muestras acumuladas
        run: |
          gh release view pace-data >/dev/null 2>&1 || gh release create pace-data --prerelease --title "Datos de ritmo (no es una version)" --notes "Muestras acumuladas para calibrar el factor k. Las genera el workflow Ritmo de los buses; no es una version de la app."
          gh release upload pace-data "$RUNNER_TEMP/pace-samples.jsonl" "$RUNNER_TEMP/segment-samples.jsonl" --clobber
          if [ -f "$RUNNER_TEMP/coverage-samples.jsonl" ]; then
            gh release upload pace-data "$RUNNER_TEMP/coverage-samples.jsonl" --clobber
          fi

  recalibrate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.recalibrate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # El algoritmo vive en un repositorio privado y se coloca en bideplus/engine (esa carpeta no se sube a este repo).
      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: bideplus/engine

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      - name: Descargar las muestras acumuladas
        run: |
          gh release download pace-data -p pace-samples.jsonl -D "$RUNNER_TEMP"
          gh release download pace-data -p segment-samples.jsonl -D "$RUNNER_TEMP" || gunzip -c bideplus/engine/bizkaibus/data/segment-samples-seed.jsonl.gz > "$RUNNER_TEMP/segment-samples.jsonl"

      - name: Calibrar
        run: |
          php bideplus/engine/bizkaibus/tools/realtime-backtest.php calibrate "$RUNNER_TEMP/pace-samples.jsonl" --write
          if [ -f "$RUNNER_TEMP/segment-samples.jsonl" ]; then
            php bideplus/engine/bizkaibus/tools/realtime-backtest.php calibrate-segments "$RUNNER_TEMP/segment-samples.jsonl" --write
          fi

      - name: Guardar el resultado si ha cambiado
        working-directory: bideplus/engine
        run: |
          FILES="bizkaibus/data/pace-factors.json bizkaibus/data/segment-times.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "Sin cambios en pace-factors.json ni segment-times.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(ls $FILES 2>/dev/null)
          git commit -m "chore(bideplus): recalibra el ritmo de los buses (factor k y tiempos por tramo)"
          git pull --rebase origin main
          git push origin HEAD:main
