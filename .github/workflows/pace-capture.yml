name: Ritmo de los buses (k)

# Mide cuanto mas rapido o mas lento que el horario van los buses de Bizkaibus
# y mantiene al dia bideplus/data/pace-factors.json (factor k) y
# bideplus/data/segment-times.json (lo que se tarda de verdad en cada tramo
# entre dos paradas, para los tramos en los que el horario no se parece a la
# realidad, como los de autopista).
#
# - Capturas: varias veces al dia captura el feed en directo unos 25 minutos,
#   y guarda solo las muestras que hacen falta (no los XML) en un fichero
#   acumulado que vive como adjunto de la release "pace-data". Las releases no
#   disparan despliegues de Vercel.
# - Recalibrado: cada dia calcula k y los tiempos por tramo con todo lo
#   acumulado. Solo cambia cada fichero si el error baja en la mitad de prueba
#   y el resultado es distinto; entonces hace un commit y Vercel despliega.
#
# Las horas estan en UTC y se han elegido para que caigan en la franja correcta
# tanto en horario de verano (UTC+2) como de invierno (UTC+1):
#   05:00 -> 07:00/06:00 punta de manana      08:30 -> 10:30/09:30 manana
#   12:00 -> 14:00/13:00 mediodia             15:30 -> 17:30/16:30 punta de tarde
#   19:00 -> 21:00/20:00 noche
# GitHub puede retrasar unos minutos los trabajos programados.

on:
  schedule:
    - cron: '0 5 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 9 * * 6,0'
    - cron: '0 16 * * 6'
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos de captura (para probar, 3)'
        default: '25'
      recalibrate:
        description: 'Recalibrar en vez de capturar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pace-data
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  NAP_API_KEY: ${{ secrets.NAP_API_KEY }}

jobs:
  capture:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.recalibrate != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      - name: Reconstruir la base de datos de Bizkaibus
        env:
          GEOCODE_MAX_NEW: '0'
          GEOCODE_MAX_RETRIES: '0'
        run: php bideplus/scripts/build-database.php --network=bus

      - name: Capturar el feed en directo
        env:
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
        run: php bideplus/scripts/realtime-backtest.php capture "$RUNNER_TEMP/capturas" "$MINUTES" 45

      - name: Descargar las muestras acumuladas
        run: |
          gh release download pace-data -p pace-samples.jsonl -D "$RUNNER_TEMP" || echo "Todavia no hay muestras acumuladas"
          gh release download pace-data -p segment-samples.jsonl -D "$RUNNER_TEMP" || echo "Todavia no hay tramos acumulados"

      - name: Anadir las muestras de esta captura
        run: |
          php bideplus/scripts/realtime-backtest.php samples "$RUNNER_TEMP/capturas" "$RUNNER_TEMP/pace-samples.jsonl"
          php bideplus/scripts/realtime-backtest.php segment-samples "$RUNNER_TEMP/capturas" "$RUNNER_TEMP/segment-samples.jsonl"

      - name: Guardar las muestras acumuladas
        run: |
          gh release view pace-data >/dev/null 2>&1 || gh release create pace-data --prerelease --title "Datos de ritmo (no es una version)" --notes "Muestras acumuladas para calibrar el factor k. Las genera el workflow Ritmo de los buses; no es una version de la app."
          gh release upload pace-data "$RUNNER_TEMP/pace-samples.jsonl" "$RUNNER_TEMP/segment-samples.jsonl" --clobber

  recalibrate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.recalibrate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      - name: Descargar las muestras acumuladas
        run: |
          gh release download pace-data -p pace-samples.jsonl -D "$RUNNER_TEMP"
          gh release download pace-data -p segment-samples.jsonl -D "$RUNNER_TEMP" || echo "Todavia no hay tramos acumulados"

      - name: Calibrar
        run: |
          php bideplus/scripts/realtime-backtest.php calibrate "$RUNNER_TEMP/pace-samples.jsonl" --write
          if [ -f "$RUNNER_TEMP/segment-samples.jsonl" ]; then
            php bideplus/scripts/realtime-backtest.php calibrate-segments "$RUNNER_TEMP/segment-samples.jsonl" --write
          fi

      - name: Guardar el resultado si ha cambiado
        run: |
          FILES="bideplus/data/pace-factors.json bideplus/data/segment-times.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "Sin cambios en pace-factors.json ni segment-times.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(ls $FILES 2>/dev/null)
          git commit -m "chore(bideplus): recalibra el ritmo de los buses (factor k y tiempos por tramo)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
