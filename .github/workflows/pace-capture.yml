name: Ritmo de los buses (k)

# Captura continua del feed en directo de Bizkaibus y recalibrado diario de los datos del algoritmo.
# El algoritmo y su documentación viven en un repositorio aparte (todos los derechos reservados).
# Las horas están en UTC; GitHub puede retrasar unos minutos los trabajos programados.
#
# Cada trabajo de captura dura unas 5 horas y media (el límite es 6) y, si ha ido bien, lanza el siguiente al acabar.
# Como GitHub retrasa o se salta muchas ejecuciones programadas, el cron horario queda de respaldo: si ya hay una
# captura en marcha, la nueva espera su turno (concurrency) y arranca en cuanto la otra acaba. Si llegan varias mientras
# tanto, solo espera la última; GitHub cancela las demás, y es normal verlas como canceladas.

on:
  schedule:
    - cron: '17 * * * *'
    # Recalibrado diario.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutos de captura en total (para probar, 6)'
        default: '330'
      block:
        description: 'Minutos por bloque (vacío: hasta la siguiente hora en punto; para probar, 3)'
        default: ''
      release:
        description: 'Release donde se acumulan las muestras'
        default: 'pace-data'
      engine_ref:
        description: 'Rama del algoritmo (vacío: la principal)'
        default: ''
      recalibrate:
        description: 'Recalibrar en vez de capturar'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  NAP_API_KEY: ${{ secrets.NAP_API_KEY }}

jobs:
  capture:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule != '0 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.recalibrate != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: pace-capture-${{ github.event.inputs.release || 'pace-data' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # El algoritmo vive en un repositorio privado y se coloca en bideplus/engine (esa carpeta no se sube a este repo).
      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          ref: ${{ github.event.inputs.engine_ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: bideplus/engine

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      - name: Reconstruir la base de datos de Bizkaibus
        env:
          GEOCODE_MAX_NEW: '0'
          GEOCODE_MAX_RETRIES: '0'
        run: php bideplus/scripts/build-database.php --network=bus

      # Captura en bloques de una hora; al acabar cada bloque mide la precisión, añade las muestras a la release y
      # archiva las capturas en bruto en el repositorio del algoritmo. Ver .github/scripts/captura-continua.sh.
      - name: Capturar y medir sin parar
        env:
          MINUTOS: ${{ github.event.inputs.minutes || '330' }}
          BLOQUE: ${{ github.event.inputs.block }}
          RELEASE: ${{ github.event.inputs.release || 'pace-data' }}
          ARCHIVO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          ENCADENAR=1
          if [ "$RELEASE" != pace-data ]; then
            ENCADENAR=0
            gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --prerelease --title "Pruebas de la captura (no es una version)" --notes "Release de prueba del workflow Ritmo de los buses."
          fi
          export ENCADENAR
          bash .github/scripts/captura-continua.sh

  recalibrate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.recalibrate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pace-recalibrate
      cancel-in-progress: false
    env:
      RELEASE: ${{ github.event.inputs.release || 'pace-data' }}
    steps:
      - uses: actions/checkout@v4

      # El algoritmo vive en un repositorio privado y se coloca en bideplus/engine (esa carpeta no se sube a este repo).
      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          ref: ${{ github.event.inputs.engine_ref }}
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: bideplus/engine

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      # La captura sube los acumulados cada hora mientras tanto; las funciones de pace-data.sh reintentan y, si pillan
      # el momento del cambio, descargan la copia nueva.
      - name: Descargar las muestras acumuladas
        run: |
          source .github/scripts/pace-data.sh
          descargar_acumulado pace-samples.jsonl "$RUNNER_TEMP"
          if ! descargar_acumulado segment-samples.jsonl "$RUNNER_TEMP"; then
            gunzip -c bideplus/engine/bizkaibus/data/segment-samples-seed.jsonl.gz > "$RUNNER_TEMP/segment-samples.jsonl"
          fi
          descargar_acumulado eta-eval.jsonl "$RUNNER_TEMP" || echo "Todavia no hay medidas de precision"
          descargar_acumulado eta-eval-historial.jsonl "$RUNNER_TEMP" || echo "Todavia no hay historial de precision"

      - name: Calibrar
        run: |
          php bideplus/engine/bizkaibus/tools/realtime-backtest.php calibrate "$RUNNER_TEMP/pace-samples.jsonl" --write
          if [ -f "$RUNNER_TEMP/segment-samples.jsonl" ]; then
            php bideplus/engine/bizkaibus/tools/realtime-backtest.php calibrate-segments "$RUNNER_TEMP/segment-samples.jsonl" --write
          fi

      - name: Informe de precision de los ultimos dias
        continue-on-error: true
        run: |
          HISTORIAL=""
          if [ -f "$RUNNER_TEMP/eta-eval-historial.jsonl" ]; then
            HISTORIAL="--historial=$RUNNER_TEMP/eta-eval-historial.jsonl"
          fi
          if [ -f "$RUNNER_TEMP/eta-eval.jsonl" ]; then
            python3 bideplus/engine/bizkaibus/tools/eta-report.py "$RUNNER_TEMP/eta-eval.jsonl" $HISTORIAL >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar el resultado si ha cambiado
        working-directory: bideplus/engine
        run: |
          FILES="bizkaibus/data/pace-factors.json bizkaibus/data/segment-times.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "Sin cambios en pace-factors.json ni segment-times.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(ls $FILES 2>/dev/null)
          git commit -m "chore(bideplus): recalibra el ritmo de los buses (factor k y tiempos por tramo)"
          git pull --rebase origin main
          git push origin HEAD:main
