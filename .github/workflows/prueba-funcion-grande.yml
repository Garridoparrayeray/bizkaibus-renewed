name: Prueba de función grande (temporal)

# Comprueba, sin tocar producción, que Vercel acepta la función de la app por encima de 250 MB con
# VERCEL_SUPPORT_LARGE_FUNCTIONS: construye como el despliegue diario, sube dos vistas previas (tal cual y con un fichero
# de relleno de 60 MB), mide lo que tardan en contestar y las borra. Se quita en cuanto haya resultado.
on:
  push:
    branches: [centro-de-pruebas]
    paths: ['.github/workflows/prueba-funcion-grande.yml']
  workflow_dispatch: {}

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BIDEPLUS }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: bideplus/engine

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Dos vistas previas, sin y con relleno
        run: |
          rm -rf bideplus/engine/.git
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          grep -c VERCEL_SUPPORT_LARGE_FUNCTIONS .vercel/.env.preview.local bideplus/.vercel/.env.preview.local 2>/dev/null || echo "(la variable no aparece en el entorno de vista previa)"
          vercel curl --help 2>&1 | head -20 || true

          medir() {
            local URL=$1 NOMBRE=$2
            for P in "/api/lines?red=bus" "/api/stops/2877/departures?red=bus&limit=3" "/api/status?red=metro"; do
              for I in 1 2 3; do
                R=$(curl -s -o respuesta.json -w '%{http_code} %{time_total}s' "$URL$P")
                echo "$NOMBRE $P intento $I: $R $(head -c 80 respuesta.json | tr '\n' ' ')"
              done
            done
          }

          desplegar() {
            local NOMBRE=$1
            git checkout -- bideplus/.vercelignore 2>/dev/null || true
            rm -rf .vercel/output bideplus/.vercel/output
            if ! vercel build --yes --token="$VERCEL_TOKEN" > "build-$NOMBRE.log" 2>&1; then
              echo "::error::$NOMBRE: vercel build falla"
              tail -40 "build-$NOMBRE.log"
              return 1
            fi
            OUT="$(ls -d .vercel/output bideplus/.vercel/output 2>/dev/null | head -1)"
            python3 bideplus/scripts/vercel-launcher.py "$OUT"
            rm -f .vercelignore bideplus/.vercelignore
            if ! URL=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" 2> "deploy-$NOMBRE.err"); then
              echo "::error::$NOMBRE: Vercel no acepta el despliegue"
              tail -30 "deploy-$NOMBRE.err"
              return 1
            fi
            echo "$NOMBRE: desplegado en $URL"
            echo "$URL" >> urls.txt
            sleep 20
            medir "$URL" "$NOMBRE"
          }

          ESTADO=0
          desplegar normal || ESTADO=1
          # 60 MB que no se comprimen: la función pasa de 250 MB.
          head -c 60000000 /dev/urandom > bideplus/data/relleno-prueba.bin
          desplegar grande || ESTADO=1
          rm -f bideplus/data/relleno-prueba.bin
          exit $ESTADO

      - name: Borrar las vistas previas
        if: always()
        run: |
          [ -f urls.txt ] || exit 0
          while read -r URL; do
            vercel rm "$URL" --yes --token="$VERCEL_TOKEN" || true
          done < urls.txt
