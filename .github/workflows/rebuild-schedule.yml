name: Rebuild schedule data

# Cada día rehace las bases de las redes (desde su GTFS) y el planificador y despliega en Vercel: es la ÚNICA vía de
# despliegue. Las bases van a la release «bases» y el planificador a «planificador», no a git. Completo: cada noche, a
# mano, «[datos]» o cambios en el constructor; rápido (otros pushes): solo las redes cuya ficha cambia sus datos.
on:
  # GitHub arranca los programados con horas de retraso: el de respaldo solo trabaja si hoy no hay aún una completa.
  schedule:
    - cron: '17 1 * * *'
    - cron: '47 4 * * *'
  push:
    branches: [master]
    paths:
      - 'bideplus/**'
      - '.github/workflows/rebuild-schedule.yml'
  workflow_dispatch:
    inputs:
      aceptar_planificador:
        description: 'Aceptar el planificador de hoy aunque tarde más que el de ayer (un recorte real de horarios)'
        type: boolean
        default: false

# Un despliegue cada vez; si llegan varios, el ultimo espera su turno y los intermedios se saltan.
concurrency:
  group: rebuild-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Un programado no hace nada si hoy (UTC) ya hay una completa de este mismo commit: si un programado cancela un
  # push que esperaba turno, el commit no coincide y despliega.
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hacer: ${{ steps.hoy.outputs.hacer }}
    steps:
      - name: Ver si ya hay una reconstrucción completa de hoy
        id: hoy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HACER=1
          if [ "${{ github.event_name }}" = "schedule" ] && gh release download bases --repo "${{ github.repository }}" -p 'bases.json*' -D bases; then
            # A medio sustituir, bases.json.nuevo es el más reciente.
            FICHA=bases/bases.json
            if [ -f bases/bases.json.nuevo ]; then
              FICHA=bases/bases.json.nuevo
            fi
            if [ "$(date -u -d "@$(jq -r '.rebuilt // 0' "$FICHA")" +%F)" = "$(date -u +%F)" ] && [ "$(jq -r '.commit // ""' "$FICHA")" = "${{ github.sha }}" ]; then
              HACER=0
              echo "### Hoy ya hay una reconstrucción completa de este commit: este programado no hace nada" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "hacer=$HACER" >> "$GITHUB_OUTPUT"

  rebuild-and-deploy:
    needs: decidir
    if: needs.decidir.outputs.hacer == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Escribe en las releases «bases» y «planificador», sube geocache.json y deja los avisos en una incidencia.
    permissions:
      contents: write
      issues: write
    env:
      NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
      # Decisión del dueño: estas redes no van a las releases públicas ni al planificador (siguen en la app). Las
      # villavesas, hasta que se resuelvan sus datos: dejar la línea vacía las devuelve a las dos.
      REDES_RESERVADAS: villavesas
      # Mapas de las tablas de andar, los lugares y las calles del mapa: Euskal Herria. Los de alrededor solo dan
      # lugares a 1500 m de una parada (Santander, Logroño, Miranda, Dax); nada de mapas lejanos.
      OSM_ORIGEN: https://download.openstreetmap.fr/extracts/europe
      MAPAS_OSM: >-
        spain/euskadi spain/comunidad_foral_de_navarra france/aquitaine/pyrenees_atlantiques
      MAPAS_ALREDEDOR: >-
        spain/cantabria spain/la_rioja spain/castilla_y_leon/burgos france/aquitaine/landes
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # El algoritmo vive en un repositorio privado y se coloca en bideplus/engine (esa carpeta no se sube a este repo).
      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          path: bideplus/engine

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      # La consola del planificador (comprobación de las consultas fijas).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decidir el tipo de despliegue
        id: tipo
        env:
          GH_TOKEN: ${{ github.token }}
          ANTES: ${{ github.event.before }}
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          REDES=todas
          if [ "${{ github.event_name }}" = "push" ] && ! printf '%s' "$MENSAJE" | grep -q '\[datos\]'; then
            CAMBIOS="$(gh api "repos/${{ github.repository }}/compare/$ANTES...${{ github.sha }}" --jq '.files[].filename' || true)"
            CONSTRUCTOR='^(bideplus/scripts/build|bideplus/scripts/networks\.php|bideplus/api/Core/Networks\.php|\.github/workflows/rebuild-schedule\.yml)'
            if [ -n "$CAMBIOS" ] && [ "$(printf '%s\n' "$CAMBIOS" | wc -l)" -lt 300 ] && ! printf '%s\n' "$CAMBIOS" | grep -qE "$CONSTRUCTOR"; then
              REDES=""
              git fetch --quiet --depth=1 origin "$ANTES" || true
              for RED in $(printf '%s\n' "$CAMBIOS" | sed -nE 's#^bideplus/api/Networks/([^/]+)\.php$#\1#p'); do
                FICHA="bideplus/api/Networks/$RED.php"
                [ -f "$FICHA" ] || continue
                DESPUES="$(php bideplus/scripts/networks.php --build-hash="$FICHA")"
                if git show "$ANTES:$FICHA" > "$RUNNER_TEMP/ficha-anterior.php" 2>/dev/null; then
                  [ "$(php bideplus/scripts/networks.php --build-hash="$RUNNER_TEMP/ficha-anterior.php")" = "$DESPUES" ] && continue
                fi
                REDES="$REDES $RED"
              done
              REDES="$(echo $REDES | xargs)"
            fi
          fi
          echo "redes=$REDES" >> "$GITHUB_OUTPUT"

      # Las de producción (release «bases»): el modo rápido parte de ellas y, si falla una opcional, queda la de ayer.
      - name: Bajar las bases de producción
        id: bajar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if php bideplus/scripts/fetch-databases.php; then
            echo "rebuilt=$(jq -r '.rebuilt' bideplus/data/bases.json)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No se han podido bajar las bases de la release «bases»: el despliegue es completo"
            echo "rebuilt=0" >> "$GITHUB_OUTPUT"
          fi

      # Sin bases de la release, o de una completa de hace más de 36 horas, el despliegue es completo.
      - name: Redes que se reconstruyen
        id: modo
        run: |
          REDES="${{ steps.tipo.outputs.redes }}"
          if [ "$REDES" != "todas" ]; then
            HECHO="${{ steps.bajar.outputs.rebuilt }}"
            if [ $(( $(date +%s) - HECHO )) -gt 129600 ]; then
              REDES=todas
            fi
          fi
          echo "redes=$REDES" >> "$GITHUB_OUTPUT"
          echo "### Redes reconstruidas en este despliegue: ${REDES:-ninguna}" >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild BizkaiBus+ database
        if: steps.modo.outputs.redes == 'todas' || contains(format(' {0} ', steps.modo.outputs.redes), ' bus ')
        run: |
          set -o pipefail
          php bideplus/scripts/build-database.php --network=bus 2>&1 | tee "$RUNNER_TEMP/bus-build.log"

      # Resumen visible en la ejecucion: que horario se ha publicado, hasta cuando vale y si los calendarios cuadran con
      # el GTFS. Avisa con diez dias de margen de que el horario publicado esta a punto de acabar (si Lantik no publica
      # uno nuevo, el build se aborta el dia que acabe y producción sigue con el último despliegue bueno).
      - name: Summarize the published schedule
        if: steps.modo.outputs.redes == 'todas' || contains(format(' {0} ', steps.modo.outputs.redes), ' bus ')
        run: |
          python3 - <<'PY'
          import os, re, sqlite3, datetime
          c = sqlite3.connect('bideplus/data/bizkaibus.sqlite')
          meta = dict(c.execute('select key, value from meta'))
          start, end, published = meta.get('feed_start_date', '?'), meta.get('feed_end_date', '?'), meta.get('schedule_source_published', '?')
          journeys = c.execute('select count(*) from service_journeys').fetchone()[0]
          audit = ''
          log = open(os.path.join(os.environ['RUNNER_TEMP'], 'bus-build.log'), encoding='utf-8', errors='replace').read()
          m = re.search(r'Auditoría de calendarios[^\n]*', log)
          if m: audit = m.group(0).strip()
          left = None
          try: left = (datetime.date.fromisoformat(end) - datetime.date.today()).days
          except ValueError: pass
          remaining = ''
          if left is not None: remaining = f' (quedan {left} días)'
          audit_line = '- Sin línea de auditoría de calendarios (revisar el log del build)'
          if audit: audit_line = f'- {audit}'
          lines = ['### Horario de Bizkaibus publicado',
                   f'- Publicado el **{published}**, vale del **{start}** al **{end}**' + remaining,
                   f'- {journeys:,} viajes en la base'.replace(',', '.'),
                   audit_line]
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('\n'.join(lines) + '\n')
          if left is not None and left <= 10:
              print(f'::warning::El horario publicado de Bizkaibus acaba el {end} (quedan {left} días). Si Lantik no publica uno nuevo, el build se aborta ese día y producción sigue con el último despliegue.')
          PY

      # Cada base se genera aparte y solo sustituye a la de ayer si termina bien y no está vacía. Si falla una
      # obligatoria (gtfs.required), el flujo se para y producción sigue como estaba; si falla una opcional, va la
      # de ayer.
      - name: Rebuild the other networks
        if: steps.modo.outputs.redes != ''
        run: |
          REDES="${{ steps.modo.outputs.redes }}"
          php bideplus/scripts/networks.php | while read -r network db required; do
            [ "$network" = "bus" ] && continue
            case " $REDES " in
              *" todas "*|*" $network "*) ;;
              *) continue ;;
            esac
            if php bideplus/scripts/build-database.php --network="$network" --output="$RUNNER_TEMP/$db.sqlite" && [ -s "$RUNNER_TEMP/$db.sqlite" ]; then
              mv "$RUNNER_TEMP/$db.sqlite" "bideplus/data/$db.sqlite"
              echo "OK: $network reconstruida"
              continue
            fi
            echo "$network" >> "$RUNNER_TEMP/redes-fallidas"
            if [ "$required" = "1" ]; then
              echo "::error::No se pudo reconstruir $network (obligatoria)"
              exit 1
            fi
            # Sin la de ayer (no se bajó al principio), se intenta otra vez solo esa.
            if [ ! -s "bideplus/data/$db.sqlite" ]; then
              php bideplus/scripts/fetch-databases.php --red="$network" || true
            fi
            echo "::warning::No se pudo reconstruir $network; se mantiene la de ayer (release «bases»)"
            echo "- No se pudo reconstruir $network: va la de ayer" >> "$RUNNER_TEMP/avisos.md"
          done

      - name: Verify databases exist and are non-empty
        run: |
          php bideplus/scripts/networks.php | while read -r network db required; do
            f="bideplus/data/$db.sqlite"
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty"
              exit 1
            fi
            echo "OK: $f ($(du -h "$f" | cut -f1))"
          done

      # sitemap.xml es estático: se regenera con las bases nuevas para que cada línea y
      # parada que aparezca o desaparezca entre o salga del sitemap en el mismo despliegue.
      - name: Rebuild sitemap.xml
        run: php bideplus/scripts/build-sitemap.php

      # El mapa de la red (/mapa): líneas, recorridos y paradas de cada red, sacados de las bases recién construidas.
      - name: Rebuild network map data
        run: php bideplus/scripts/build-network-map.php

      # Horarios sin conexión: el horario oficial de cada red, que el móvil guarda si la persona lo elige en Info.
      - name: Rebuild offline timetables
        run: php bideplus/scripts/build-offline-data.php

      # Puerta antes de desplegar: si las bases nuevas rompen el cálculo de llegadas, la
      # integridad de los datos o el contrato de la API, no se despliega y producción
      # sigue con el último despliegue bueno.
      - name: Check rebuilt data before deploying
        working-directory: bideplus
        run: |
          php tests/unit-test.php
          php tests/data-integrity.php
          PHP_CLI_SERVER_WORKERS=4 php -S localhost:8011 dev-router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8011/; then break; fi
            sleep 1
          done
          python3 tests/api-contract.py

      # Solo cuenta como completa si se han rehecho todas: si no, el de respaldo y el siguiente push lo reintentan.
      - name: Preparar las bases para la release «bases»
        run: |
          REHECHA="${{ steps.bajar.outputs.rebuilt }}"
          if [ "${{ steps.modo.outputs.redes }}" = "todas" ] && [ ! -s "$RUNNER_TEMP/redes-fallidas" ]; then
            REHECHA="$(date +%s)"
          fi
          php bideplus/scripts/prepare-databases.php --out="$RUNNER_TEMP/release-bases" --except="$REDES_RESERVADAS" \
            --rebuilt="$REHECHA" --commit="${{ github.sha }}"

      # Planificador (bideplus/scripts/build-planner.php): si algo falla o se cuelga, va el de ayer y no se para.
      - name: Planificador de ayer (release «planificador»)
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: planificador
        run: |
          mkdir -p "$RUNNER_TEMP/ayer"
          source .github/scripts/pace-data.sh
          if descargar_acumulado planificador.tar.gz "$RUNNER_TEMP/ayer"; then
            tar -xzf "$RUNNER_TEMP/ayer/planificador.tar.gz" -C "$RUNNER_TEMP/ayer"
            descargar_acumulado resultados.json "$RUNNER_TEMP/ayer" || echo "Sin las consultas de ayer"
          else
            echo "Sin planificador de ayer: se hace entero"
          fi

      - name: Planificador, paquetes de horarios
        id: plan
        continue-on-error: true
        timeout-minutes: 10
        run: |
          php bideplus/scripts/build-planner.php --out="$RUNNER_TEMP/plan" --databases=bideplus/data \
            --except="$REDES_RESERVADAS" --previous="$RUNNER_TEMP/ayer"
          echo "clave=osm-$(date -u +%G-%V)-$(printf '%s' "$MAPAS_OSM $MAPAS_ALREDEDOR" | sha1sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      # Las tablas de andar, los lugares y las calles del mapa, cuando no valen los de ayer (cada semana o si cambian
      # paradas).
      - name: Mapas de OSM de esta semana
        id: osm
        if: steps.plan.outputs.andar == '1'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/osm
          key: ${{ steps.plan.outputs.clave }}

      - name: Bajar los mapas de OSM
        id: bajar-osm
        if: steps.plan.outputs.andar == '1' && steps.osm.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/osm/alrededor"
          for MAPA in $MAPAS_OSM; do
            FICHERO="$RUNNER_TEMP/osm/$(basename "$MAPA")-latest.osm.pbf"
            curl -fsSL --retry 4 --retry-delay 15 -o "$FICHERO.bajando" "$OSM_ORIGEN/$MAPA-latest.osm.pbf"
            mv "$FICHERO.bajando" "$FICHERO"
          done
          for MAPA in $MAPAS_ALREDEDOR; do
            FICHERO="$RUNNER_TEMP/osm/alrededor/$(basename "$MAPA")-latest.osm.pbf"
            curl -fsSL --retry 4 --retry-delay 15 -o "$FICHERO.bajando" "$OSM_ORIGEN/$MAPA-latest.osm.pbf"
            mv "$FICHERO.bajando" "$FICHERO"
          done
          du -sh "$RUNNER_TEMP/osm"

      - name: Guardar los mapas de OSM de esta semana
        if: steps.bajar-osm.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/osm
          key: ${{ steps.plan.outputs.clave }}

      - name: Planificador, andar y lugares
        id: andar
        if: steps.plan.outputs.andar == '1' && steps.bajar-osm.outcome != 'failure'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          php bideplus/scripts/build-planner.php --out="$RUNNER_TEMP/plan" --walk \
            --osm="$(ls "$RUNNER_TEMP"/osm/*.osm.pbf | paste -sd, -)" \
            --near="$(ls "$RUNNER_TEMP"/osm/alrededor/*.osm.pbf | paste -sd, -)"

      # Puerta del planificador (bideplus/tests/planner-check.php): si falla, va el de ayer. Compara con las consultas
      # del último planificador desplegado; un recorte real de horarios se acepta a mano (aceptar_planificador).
      - name: Planificador, consultas fijas
        id: comprobar
        continue-on-error: true
        timeout-minutes: 10
        env:
          PAQUETES: ${{ steps.plan.outcome }}
          FALTA_ANDAR: ${{ steps.plan.outputs.andar }}
          ANDAR_VIEJO: ${{ steps.plan.outputs.andar_viejo }}
          ANDAR: ${{ steps.andar.outcome }}
          ACEPTAR: ${{ inputs.aceptar_planificador }}
        run: |
          NUEVO=0
          LISTO=0
          if [ "$PAQUETES" = success ]; then
            LISTO=1
          fi
          if [ "$FALTA_ANDAR" = 1 ] && [ "$ANDAR" != success ]; then
            LISTO=0
            # Una tabla de andar de hace una semana sigue valiendo: mejor eso que dejar los horarios de ayer.
            if [ "$ANDAR_VIEJO" = 1 ]; then
              LISTO=1
              echo "::warning::No se ha podido rehacer la tabla de andar: va la de la semana pasada"
              echo "- No se ha podido rehacer la tabla de andar (¿mapas de OSM?): va la de la semana pasada" >> "$RUNNER_TEMP/avisos.md"
            fi
          fi
          ANTES="$RUNNER_TEMP/ayer/resultados.json"
          if [ "$ACEPTAR" = true ]; then
            ANTES=""
            echo "### Planificador aceptado a mano: no se compara con el de ayer" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$LISTO" = 1 ] && php bideplus/tests/planner-check.php \
            --data="$RUNNER_TEMP/plan/planificador/build/data" --engine=bideplus/engine/planner \
            --except="$REDES_RESERVADAS" --previous="$ANTES" --out="$RUNNER_TEMP/plan/resultados.json" 2> "$RUNNER_TEMP/puerta.txt"; then
            NUEVO=1
          else
            echo "::warning::El planificador nuevo no se ha podido hacer o no pasa las consultas fijas: va el de ayer"
            echo "- El planificador nuevo no se ha podido hacer o no pasa las consultas fijas: va el de ayer. $(cat "$RUNNER_TEMP/puerta.txt" 2>/dev/null)" >> "$RUNNER_TEMP/avisos.md"
          fi
          echo "nuevo=$NUEVO" >> "$GITHUB_OUTPUT"

      # Sin el de hoy ni el de ayer solo se despliega la primera vez (aún no hay release «planificador»): si no, se para
      # y producción sigue con el planificador que tiene.
      - name: Planificador al despliegue
        id: planificador
        env:
          GH_TOKEN: ${{ github.token }}
          NUEVO: ${{ steps.comprobar.outputs.nuevo }}
        run: |
          ORIGEN="$RUNNER_TEMP/plan"
          if [ "$NUEVO" != 1 ]; then
            ORIGEN="$RUNNER_TEMP/ayer"
          fi
          if [ -f "$ORIGEN/planificador/origen.json" ]; then
            cp -a "$ORIGEN/planificador" "$ORIGEN/docs" bideplus/
            echo "hay=1" >> "$GITHUB_OUTPUT"
            DIAS=$(( ($(date +%s) - $(jq -r '.generated' "$ORIGEN/planificador/origen.json")) / 86400 ))
            echo "### Planificador desplegado: $(basename "$ORIGEN"), de hace $DIAS días ($(du -sh bideplus/planificador | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DIAS" -ge 3 ]; then
              echo "::warning::El planificador desplegado es de hace $DIAS días"
              echo "- El planificador desplegado es de hace $DIAS días" >> "$RUNNER_TEMP/avisos.md"
            fi
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/planificador")
          if [ "$CODE" != 404 ]; then
            echo "::error::No hay planificador que desplegar, ni el de hoy ni el de ayer (release «planificador»: HTTP $CODE)"
            exit 1
          fi
          echo "::warning::Primer despliegue sin planificador: no hay ni el de hoy ni release «planificador»"
          echo "- Primer despliegue sin planificador: no hay ni el de hoy ni release «planificador»" >> "$RUNNER_TEMP/avisos.md"

      - name: Commit updated geocache, if it changed
        run: |
          if ! git diff --quiet bideplus/scripts/geocache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bideplus/scripts/geocache.json
            git commit -m "chore: update geocache with newly seen stop coordinates"
            # GitHub rechaza a veces el push con un error suyo («fatal error in commit_refs», 4/11/2026) o porque
            # master ha cambiado entretanto: se reintenta hasta tres veces, poniéndose al día antes.
            for INTENTO in 1 2 3; do
              git push && break
              [ "$INTENTO" = 3 ] && exit 1
              sleep 10
              git pull --rebase
            done
          else
            echo "geocache.json unchanged, nothing to commit"
          fi

      # La huella de los ficheros de la app en sw.js: con ella el móvil no los vuelve a pedir en cada apertura y baja
      # la versión nueva entera en cuanto cambia alguno. Va después del commit de geocache para no subirla al
      # repositorio. Si fallara, sw.js se queda sin huella y la app funciona como hasta ahora: no frena el despliegue.
      - name: Stamp the app files fingerprint in sw.js
        continue-on-error: true
        run: php bideplus/scripts/stamp-sw.php

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel ya no arranca las funciones tal como las emite vercel-php (vercel-community/php#650): se construye aquí,
      # se parchea el lanzador (bideplus/scripts/vercel-launcher.py) y se sube la salida ya construida.
      - name: Deploy freshly rebuilt database to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BIDEPLUS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # El checkout del algoritmo deja su .git dentro de bideplus/engine y Vercel no admite subirlo.
          rm -rf bideplus/engine/.git
          vercel build --prod --yes --token="$VERCEL_TOKEN"
          OUT="$(ls -d .vercel/output bideplus/.vercel/output 2>/dev/null | head -1)"
          python3 bideplus/scripts/vercel-launcher.py "$OUT"
          rm -f .vercelignore bideplus/.vercelignore
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"

      # Si lo recién desplegado no responde, el flujo falla aquí y no llega a la limpieza del final: el anterior sigue
      # en Vercel y «Rollback production» puede volver a él. Con el flujo en verde, la limpieza ya los ha borrado.
      - name: Comprobar producción
        run: |
          SITIO=$(php -r 'echo (require "bideplus/api/Config/site.php")["url"];')
          for i in $(seq 1 6); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$SITIO/api/lines")
            echo "producción /api/lines -> $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Producción no responde con el despliegue nuevo"
          exit 1

      - name: Comprobar el planificador en producción
        if: steps.planificador.outputs.hay == '1'
        run: |
          SITIO=$(php -r 'echo (require "bideplus/api/Config/site.php")["url"];')
          for RUTA in /planificador/pantallas/ /planificador/build/data/manifest.json /planificador/dist/bideplan.wasm; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$SITIO$RUTA")
            echo "producción $RUTA -> $CODE"
            if [ "$CODE" != "200" ]; then
              echo "::warning::El planificador no responde en producción: $RUTA da $CODE"
              echo "- El planificador no responde en producción: $RUTA da $CODE" >> "$RUNNER_TEMP/avisos.md"
            fi
          done

      # Lo desplegado queda en la release. Cada base lleva su huella en el nombre y solo se sube si no está; bases.json
      # va el último (nunca falta: ver pace-data.sh) y luego se borran las que no citan ni el nuevo ni el de ayer.
      - name: Guardar las bases en la release «bases»
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: bases
        run: |
          source .github/scripts/pace-data.sh
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --prerelease --title "Bases de las redes (no es una versión)" --notes "Las bases .sqlite de producción, comprimidas. Las sustituye cada día «Rebuild schedule data»; se bajan con bideplus/scripts/fetch-databases.php."
          FALLO=0
          if ! EN_RELEASE=$(ficheros_release); then
            FALLO=1
          fi
          for FICHERO in "$RUNNER_TEMP"/release-bases/*.sqlite.gz; do
            if [ "$FALLO" = 0 ] && ! grep -qxF "$(basename "$FICHERO")" <<<"$EN_RELEASE"; then
              reintentar 3 gh release upload "$RELEASE" --repo "$REPO_APP" "$FICHERO" --clobber || FALLO=1
            fi
          done
          if [ "$FALLO" = 0 ]; then
            subir_acumulado "$RUNNER_TEMP/release-bases/bases.json" || FALLO=1
          fi
          if [ "$FALLO" = 0 ]; then
            CITADAS=$(jq -r '.networks[].file' "$RUNNER_TEMP/release-bases/bases.json")
            if [ -f bideplus/data/bases.json ]; then
              CITADAS="$CITADAS"$'\n'"$(jq -r '.networks[].file' bideplus/data/bases.json)"
            fi
            gh api "repos/$REPO_APP/releases/tags/$RELEASE" --jq '.assets[] | "\(.name) \(.id)"' > "$RUNNER_TEMP/ficheros-bases" || true
            while read -r NOMBRE ID; do
              case "$NOMBRE" in
                bases.json*) continue ;;
              esac
              if ! grep -qxF "$NOMBRE" <<<"$CITADAS"; then
                gh api -X DELETE "repos/$REPO_APP/releases/assets/$ID" >/dev/null || echo "No se ha podido borrar $NOMBRE"
              fi
            done < "$RUNNER_TEMP/ficheros-bases"
          fi
          if [ "$FALLO" = 1 ]; then
            echo "::warning::No se han podido subir las bases a la release «bases»: se queda la de antes"
            echo "- No se han podido subir las bases a la release «bases»: la release se queda con las de antes" >> "$RUNNER_TEMP/avisos.md"
          fi

      # Solo el que pasa la puerta, con sus consultas: mañana se compara con lo que de verdad está desplegado.
      - name: Guardar el planificador en la release «planificador»
        if: steps.comprobar.outputs.nuevo == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: planificador
        run: |
          source .github/scripts/pace-data.sh
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --prerelease --title "Datos del planificador (no es una versión)" --notes "El planificador de producción y sus consultas fijas. Lo sustituye cada día «Rebuild schedule data»."
          tar -czf "$RUNNER_TEMP/planificador.tar.gz" -C "$RUNNER_TEMP/plan" planificador docs
          if ! subir_acumulado "$RUNNER_TEMP/planificador.tar.gz" || ! subir_acumulado "$RUNNER_TEMP/plan/resultados.json"; then
            echo "::warning::No se ha podido guardar el planificador en su release"
            echo "- No se ha podido guardar el planificador en su release: mañana se parte del anterior" >> "$RUNNER_TEMP/avisos.md"
          fi

      # IndexNow: avisa a Bing (y a los buscadores que lo comparten) de las páginas principales en los tres idiomas.
      # Si falla, solo lo dice: el despliegue ya está hecho.
      - name: Avisar a los buscadores (IndexNow)
        run: php bideplus/scripts/indexnow.php || echo "::warning::IndexNow no ha respondido bien"

      # El directo de cada red en producción (.github/scripts/live-health.py): si algo no cuadra, avisa y sigue.
      - name: Vigilar el directo
        run: |
          SITIO=$(php -r 'echo (require "bideplus/api/Config/site.php")["url"];')
          if ! python3 .github/scripts/live-health.py "$SITIO" $(php bideplus/scripts/networks.php --slugs); then
            echo "::warning::El directo de alguna red no cuadra en producción (ver «Vigilar el directo»)"
            echo "### El directo de alguna red no cuadra (ver «Vigilar el directo»)" >> "$GITHUB_STEP_SUMMARY"
            echo "- El directo de alguna red no cuadra en producción (ver «Vigilar el directo»)" >> "$RUNNER_TEMP/avisos.md"
          fi

      - name: Clean up old deployments to save Vercel storage
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BIDEPLUS }}
        run: vercel rm bizkaibus-renewed --safe --yes --token="${{ secrets.VERCEL_TOKEN }}" || true

      # GitHub no avisa de los ::warning::: los avisos del día van a una incidencia abierta (un comentario cada vez).
      - name: Avisar al dueño
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/avisos.md" ]; then
            exit 0
          fi
          TITULO="Avisos de la reconstrucción diaria"
          CUERPO="$(printf 'Ejecución: %s/%s/actions/runs/%s\n\n' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"; cat "$RUNNER_TEMP/avisos.md")"
          NUMERO=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq "map(select(.title == \"$TITULO\"))[0].number // empty")
          if [ -n "$NUMERO" ]; then
            gh issue comment "$NUMERO" --repo "${{ github.repository }}" --body "$CUERPO"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITULO" --body "$CUERPO"
          fi
