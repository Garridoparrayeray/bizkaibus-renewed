name: Rebuild schedule data

# Reconstruye y redespliega data/bizkaibus.sqlite, data/metrobilbao.sqlite y
# data/euskotren.sqlite a diario desde sus respectivos GTFS oficiales. Los
# .sqlite no se comitean (solo geocache.json si cambia) — se regeneran en el
# runner y se suben tal cual con el deploy de Vercel.
#
# Fuentes primarias: NAP (nap.transportes.gob.es) con ApiKey.
# Fuentes fallback:  S3 (Bizkaibus), CMS (Metro), local zip (Euskotren).

on:
  schedule:
    - cron: '0 3 * * *' # diario, 03:00 UTC
  workflow_dispatch: {} # allows manually clicking "Run workflow" too

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    env:
      NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring

      - name: Rebuild BizkaiBus+ database
        run: php bideplus/scripts/build-database.php --network=bus

      - name: Rebuild Metro+ database
        run: php bideplus/scripts/build-database.php --network=metro

      - name: Rebuild Euskotren+ database
        run: php bideplus/scripts/build-database.php --network=euskotren

      # Los tranvias y Renfe tambien cambian de temporada y horario. Cada base se
      # genera en un fichero temporal y solo sustituye a la del repositorio si
      # el build termina bien y no esta vacia: si una fuente falla se conserva
      # la anterior y el resto del flujo (incluido el despliegue) sigue.
      - name: Rebuild Tranvia Bilbao+, Tranvia Vitoria+ and Renfe Cercanias+ databases
        run: |
          for item in tranvia-bilbao:tranviabilbao tranvia-vitoria:tranviavitoria renfe:renfe; do
            network="${item%%:*}"
            file="${item##*:}"
            if php bideplus/scripts/build-database.php --network="$network" --output="$RUNNER_TEMP/$file.sqlite" && [ -s "$RUNNER_TEMP/$file.sqlite" ]; then
              mv "$RUNNER_TEMP/$file.sqlite" "bideplus/data/$file.sqlite"
              echo "OK: $network reconstruida"
            else
              echo "::warning::No se pudo reconstruir $network; se mantiene la base de datos del repositorio"
            fi
          done

      - name: Verify databases exist and are non-empty
        run: |
          for db in bideplus/data/bizkaibus.sqlite \
                     bideplus/data/metrobilbao.sqlite \
                     bideplus/data/euskotren.sqlite \
                     bideplus/data/tranviabilbao.sqlite \
                     bideplus/data/tranviavitoria.sqlite \
                     bideplus/data/renfe.sqlite; do
            if [ ! -s "$db" ]; then
              echo "ERROR: $db is missing or empty"
              exit 1
            fi
            echo "OK: $db ($(du -h "$db" | cut -f1))"
          done

      - name: Commit updated geocache, if it changed
        run: |
          if ! git diff --quiet bideplus/scripts/geocache.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bideplus/scripts/geocache.json
            git commit -m "chore: update geocache with newly seen stop coordinates"
            git push
          else
            echo "geocache.json unchanged, nothing to commit"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy freshly rebuilt database to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BIDEPLUS }}
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Clean up old deployments to save Vercel storage
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BIDEPLUS }}
        run: vercel rm bideplus --safe --yes --token="${{ secrets.VERCEL_TOKEN }}" || true
