name: Tests

on:
  # Una rama se prueba por su PR; el push solo prueba lo que llega a master (así cada commit corre una vez, no dos).
  push:
    branches:
      - master
    paths:
      - 'bideplus/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'bideplus/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Sin la release «bases» se construyen todas desde los GTFS (unos 6 minutos más).
    timeout-minutes: 40
    defaults:
      run:
        working-directory: bideplus
    env:
      CI: 'true'
      BASE_URL: http://localhost:8011
    steps:
      - uses: actions/checkout@v4

      # El algoritmo vive en un repositorio privado y se coloca en bideplus/engine (esa carpeta no se sube a este repo).
      # Si allí hay una rama con el mismo nombre que esta (centro-de-pruebas), se prueba con ella; si no, con main.
      - name: Rama del algoritmo
        id: engine
        env:
          ENGINE_REPO_TOKEN: ${{ secrets.ENGINE_REPO_TOKEN }}
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # El secreto puede llevar un salto de línea al final: fuera.
          TOKEN="$(printf '%s' "$ENGINE_REPO_TOKEN" | tr -d '\r\n')"
          REF=main
          # Por su nombre exacto: GitHub redirige la antigua «master» a «main» y respondería que existe.
          FOUND="$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/Garridoparrayeray/bideplus-engine/branches/$BRANCH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("name", ""))' 2>/dev/null || true)"
          if [ "$FOUND" = "$BRANCH" ]; then
            REF="$BRANCH"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Algoritmo: rama $REF"
      - name: Traer el algoritmo (repositorio privado)
        uses: actions/checkout@v4
        with:
          repository: Garridoparrayeray/bideplus-engine
          token: ${{ secrets.ENGINE_REPO_TOKEN }}
          ref: ${{ steps.engine.outputs.ref }}
          path: bideplus/engine

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Las bases no están en git: las de producción (release «bases»). Las que falten (una red nueva de la rama, o
      # todas antes de la primera reconstrucción con la release) se construyen desde los GTFS.
      - name: Bajar las bases
        env:
          GH_TOKEN: ${{ github.token }}
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
          GEOCODE_MAX_NEW: '0'
        run: |
          php scripts/fetch-databases.php || echo "::warning::No se han podido bajar todas las bases: se construyen las que falten"
          php scripts/networks.php | while read -r network db required; do
            if [ ! -s "data/$db.sqlite" ]; then
              echo "Construyendo $network desde su GTFS"
              php scripts/build-database.php --network="$network"
            fi
          done

      # Los datos del planificador publicado (release «planificador», los de producción): sin ellos, ui-route.mjs no
      # prueba nada. Solo los datos: pantallas, JS y WebAssembly salen del motor de esta prueba (dev-router.php).
      - name: Datos del planificador publicado
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: planificador
        run: |
          source ../.github/scripts/pace-data.sh
          if descargar_acumulado planificador.tar.gz "$RUNNER_TEMP/plan"; then
            tar -xzf "$RUNNER_TEMP/plan/planificador.tar.gz" -C "$RUNNER_TEMP/plan"
            mkdir -p planificador/build
            cp -r "$RUNNER_TEMP/plan/planificador/build/data" planificador/build/data
            ls planificador/build/data/manifest.json
            # Los paquetes, rehechos con la herramienta del motor de esta prueba: sus reglas pueden ser más nuevas que las
            # de los publicados, y su WebAssembly rechazaría los viejos. Lo demás (andar, lugares, trazados), el publicado.
            BASE_DATE="$(python3 -c "import json; print(json.load(open('planificador/build/data/manifest.json'))['base_date'])")"
            if php engine/planner/tools/build-packs.php --out="$RUNNER_TEMP/packs" --base-date="$BASE_DATE" --app=.; then
              python3 ../.github/scripts/planner-packs.py "$RUNNER_TEMP/packs" planificador/build/data
            else
              echo "::warning::No se han podido rehacer los paquetes del planificador con este motor"
            fi
          else
            echo "::warning::Sin el planificador publicado: la prueba de su pantalla no probará nada"
          fi

      # El mapa de la red (/mapa) lee map-data/*.json, que se generan con las bases como en la reconstrucción diaria.
      - name: Datos del mapa de la red
        run: php scripts/build-network-map.php

      # Los horarios sin conexión (offline-data/*.json) también salen de las bases.
      - name: Horarios sin conexión
        run: php scripts/build-offline-data.php

      - name: Start local server
        run: |
          # 8 a la vez: una petición que espera a un feed lento (Renfe, hasta 8 s) no deja sin servidor a las demás.
          PHP_CLI_SERVER_WORKERS=8 php -S localhost:8011 dev-router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8011/; then exit 0; fi
            sleep 1
          done
          echo "El servidor local no arranca"
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: Static checks, unit tests and data integrity
        run: python tests/static-checks.py

      # Las pruebas del planificador que no necesitan sus datos (planner/build/data): sin esto no las lanza nadie.
      - name: Planificador del motor (normas del C, casos a mano, memoria y directo grabado)
        working-directory: bideplus/engine/planner
        run: |
          python tests/quality.py
          python tests/scenarios.py
          node tests/places.mjs
          python tests/live-capture.py --app ../..
          mkdir -p build
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -Isrc -fsanitize=address,undefined -fno-sanitize-recover=all \
            -o build/driver-san tests/native/Driver.c $(ls src/*.c | grep -v Wasm.c)
          python tests/scenarios.py --driver build/driver-san
          python tests/pareto.py --driver build/driver-san

      - name: API smoke tests
        run: python tests/api-smoke.py

      - name: API contract (campos y tipos que usa la app)
        run: python tests/api-contract.py

      - name: Horarios sin conexión (las salidas guardadas son las de la API)
        run: node tests/offline-schedule.mjs

      - name: Periodos del horario oficial (sin años pasados, días sueltos juntos)
        run: node tests/schedule-periods.mjs

      - name: Enlaces de los avisos (direcciones web en los textos)
        run: node tests/linkify.mjs

      - name: Aviso general (el script del workflow y lo que acepta la app)
        run: python tests/aviso-script.py

      - name: Vigilante del directo y poda de los acumulados (scripts de los workflows)
        run: python tests/live-health.py && python tests/podar-acumulado.py && python tests/vercel-deploy.py && python tests/rebuild-commit.py

      - name: UI battery
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-battery.mjs

      - name: UI offline (recursos propios y servicio sin conexion)
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-offline.mjs

      - name: UI avisos (notificaciones de incidencias)
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-alerts.mjs

      - name: UI cerca de mi (GPS)
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-nearby.mjs

      - name: UI Bide+ (pestañas, columna lateral y páginas comunes)
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-bide.mjs

      # Casos límite del cliente: respuestas viejas, hora de Madrid en otro huso, medianoche, service worker con la red
      # caída, avisos cancelados sin conexión, accesibilidad, textos traducidos y nombres como texto en el mapa.
      - name: UI casos límite (ui-edge)
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-edge.mjs

      # Sin el planificador publicado (planificador/build/data, que no se genera aquí) la prueba lo dice y no falla.
      - name: UI planificador del inicio (tarjeta, opciones, filtros y viaje)
        env:
          CHROME_PATH: google-chrome
        run: node tests/ui-route.mjs

      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/php-server.log" || true
