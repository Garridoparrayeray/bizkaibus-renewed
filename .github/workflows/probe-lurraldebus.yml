name: Probe Lurraldebus (temporal)

on:
  push:
    branches: [claude/vibrant-ritchie-yfwaei]
    paths: ['.github/workflows/probe-lurraldebus.yml']

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Feeds en directo por operador
        run: |
          set +e
          B=https://opendata.euskadi.eus/transport/moveuskadi/lurraldebus
          date -u
          for op in ekialdebus goierrialdea guipuzkoana pesa tbh tolosa; do
            for f in siri_${op}_vehicle_monitoring.xml siri_${op}_estimated_timetable.xml gtfsrt_${op}_vehicle_positions.pb gtfsrt_${op}_trip_updates.pb; do
              curl -sS -L --max-time 30 -o "$op-$f" -w "== $op/$f HTTP %{http_code} %{size_download}B\n" "$B/$op/$f"
            done
          done
          curl -sS -L --max-time 30 -o eb-et.xml -w "== euskotren_bus ET HTTP %{http_code} %{size_download}B\n" "$B/euskotren_bus/siri_euskobus_estimated_timetable.xml"
          curl -sS -L --max-time 30 -o eb-tu.pb -w "== euskotren_bus TU HTTP %{http_code} %{size_download}B\n" "$B/euskotren_bus/gtfsrt_euskotren_bus_trip_updates.pb"
          echo; echo "=== Muestras (el mayor de cada tipo)"
          for pat in '*vehicle_monitoring.xml' '*estimated_timetable.xml' 'eb-et.xml'; do
            f=$(ls -S $pat 2>/dev/null | head -1); [ -n "$f" ] && { echo "--- $f"; head -c 5000 "$f"; echo; }
          done
          for pat in '*vehicle_positions.pb' '*trip_updates.pb'; do
            f=$(ls -S $pat 2>/dev/null | head -1); [ -n "$f" ] && { echo "--- $f ($(stat -c%s $f)B)"; strings -n 3 "$f" | head -60 | tr '\n' ' '; echo; }
          done
