name: Probe Lurraldebus (temporal)

on:
  push:
    branches: [claude/vibrant-ritchie-yfwaei]
    paths: ['.github/workflows/probe-lurraldebus.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, zip, mbstring
      - name: Build Lurraldebus
        run: php bideplus/scripts/build-database.php --network=lurraldebus
      - name: Resumen
        run: |
          python3 - <<'PY'
          import sqlite3
          c = sqlite3.connect('bideplus/data/lurraldebus.sqlite')
          for t in ('stops', 'lines', 'journey_patterns', 'service_journeys', 'passing_times', 'calendars'):
              try: print(t, c.execute(f'select count(*) from {t}').fetchone()[0])
              except Exception as e: print(t, e)
          print(dict(c.execute('select key, value from meta')))
          print(c.execute('select id, code, name from lines limit 12').fetchall())
          print(c.execute('select id, name from stops limit 8').fetchall())
          PY
      - name: Commit
        run: |
          php bideplus/scripts/build-sitemap.php
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bideplus/data/lurraldebus.sqlite bideplus/sitemap.xml
          git commit -m "chore(bideplus): base de datos inicial de Lurraldebus"
          git push
