name: Check production

# Comprobación manual del sitio desplegado (Actions > Check production > Run workflow).
# Verifica lo que importa para el SEO: robots, sitemaps, título/descripción/canonical
# por página y que el HTML servido no empiece con avisos de «necesita JavaScript».

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL base a comprobar
        default: https://bideplus.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ inputs.base_url }}
    steps:
      - name: robots.txt y llms.txt
        run: |
          set -e
          curl -fsS "$BASE/robots.txt" | grep -q "Sitemap: $BASE/sitemap.xml"
          curl -fsS "$BASE/llms.txt" | grep -q "Bide+"

      - name: Sitemap
        run: |
          set -e
          # Como lo pide Google: con su user-agent, mostrando estado y tipo de contenido.
          curl -sS -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" -D headers.txt -o sitemap.xml "$BASE/sitemap.xml"
          grep -iE '^(HTTP|content-type|content-length|x-vercel-cache)' headers.txt
          head -1 headers.txt | grep -q ' 200' || { echo "::error::sitemap.xml no responde 200 a Googlebot"; exit 1; }
          grep -qi '^content-type: *\(application\|text\)/xml' headers.txt || { echo "::error::sitemap.xml sin Content-Type XML"; exit 1; }
          python3 -c "import xml.dom.minidom as m; m.parse('sitemap.xml')" || { echo "::error::sitemap.xml no es XML válido"; exit 1; }
          for r in bus metro euskotren tranvia-bilbao tranvia-vitoria renfe; do
            grep -q "/?red=$r</loc>" sitemap.xml || { echo "::error::falta la app $r"; exit 1; }
          done
          echo "URLs: $(grep -c '<url>' sitemap.xml) | líneas: $(grep -c '/lines/' sitemap.xml) | paradas: $(grep -c '/stops/' sitemap.xml)"
          [ "$(grep -c '<url>' sitemap.xml)" -gt 1000 ] || { echo "::error::sitemap.xml con muy pocas URLs"; exit 1; }

      - name: Títulos, descripción, canonical y snippet
        run: |
          fail=0
          check() {
            url="$BASE$1"
            curl -fsS "$url" -o page.html || { echo "::error::$url no responde"; fail=1; return 0; }
            echo "$url -> $(grep -o '<title>[^<]*</title>' page.html | head -1)"
            grep -q '<meta name="description" content="[^"]\{40,\}' page.html || { echo "::error::$url sin descripción útil"; fail=1; }
            grep -q '<link rel="canonical"' page.html || { echo "::error::$url sin canonical"; fail=1; }
            grep -q 'application/ld+json' page.html || { echo "::error::$url sin JSON-LD"; fail=1; }
            # el primer texto del <noscript> no debe ser el aviso de JavaScript
            if tr '\n' ' ' < page.html | grep -o '<noscript>.\{0,200\}' | grep -qi '^<noscript> *<p>[^<]*necesita JavaScript'; then
              echo "::error::$url empieza con el aviso de JavaScript"; fail=1
            fi
            return 0
          }
          for p in "/" "/?red=bus" "/?red=metro" "/?red=euskotren" "/?red=tranvia-bilbao" "/?red=tranvia-vitoria" "/?red=renfe" "/stops/4255" "/lines/2151"; do
            check "$p"
          done
          # los títulos de cada app deben ser distintos
          dup=$(for r in bus metro euskotren tranvia-bilbao tranvia-vitoria renfe; do curl -fsS "$BASE/?red=$r" | grep -o '<title>[^<]*</title>' | head -1; done | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::títulos repetidos entre apps: $dup"; fail=1; }
          exit $fail

      - name: 404 en páginas inexistentes
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/stops/no-existe-999999")
          [ "$code" = "404" ] || { echo "::error::esperaba 404, obtuve $code"; exit 1; }
